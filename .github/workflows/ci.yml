name: offline-private-cluster
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned PostgreSQL and qualified SQLite runtime
        timeout-minutes: 12
        run: docker build -t logical-snapshot-handoff-lab:ci .
      - name: Real private PostgreSQL regression suite offline
        timeout-minutes: 4
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m logical-snapshot-handoff-lab:ci go test -p 1 ./...
      - name: Independent SQL asserting demo offline
        timeout-minutes: 3
        run: docker run --rm --network none --cap-drop ALL --security-opt no-new-privileges --pids-limit 256 --memory 1g --cpus 2 --read-only --tmpfs /tmp:rw,exec,nosuid,nodev,size=512m logical-snapshot-handoff-lab:ci go run ./cmd/demo
